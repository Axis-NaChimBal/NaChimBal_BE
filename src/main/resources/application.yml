server:
  port: 8080

spring:
  application:
    name: NaChimBal
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://localhost:3306/nachimbaldb?serverTimezone=Asia/Seoul&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
  servlet:
    multipart:
      max-file-size: 50MB
      max-request-size: 50MB
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  mail:
    host: smtp.gmail.com
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000
jwt:
  secret: ${JWT_SECRET}
  access-token-expiration: 3600000
  refresh-token-expiration: 1209600000

logging:
  level:
    com.axis.nachimbal: DEBUG

oauth:
  google:
    client-id: 686084387725-shclkcr0ik1nkd9dtqb05n255bo2n0kq.apps.googleusercontent.com

api:
  key: ${TMAP_API_KEY}
  base-url: https://apis.openapi.sk.com/tmap

ncp:
  maps:
    client-id: ${NCP_CLIENT_ID}
    client-secret: ${NCP_CLIENT_SECRET}
    reverse-geocode-url: https://maps.apigw.ntruss.com/map-reversegeocode/v2/gc

ai:
  server:
    url: ${AI_SERVER_URL:http://localhost:8000}
  gps-art:
    base-url: ${AI_SERVER_URL:http://localhost:8000}

openai:
  api:
    key: ${OPENAI_API_KEY}
  model: gpt-5.5
  base-url: https://api.openai.com/v1/chat/completions